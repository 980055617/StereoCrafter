name: stereocrafter
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pytorch=2.4.0
  - torchvision=0.19.0
  - torchaudio=2.4.0
  - pytorch-cuda=12.1
  - cuda-version=12.1
  - cuda-nvcc=12.1.66
  - cuda-cudart-dev=12.1.105
  - libcurand-dev=10.3.5.147
  - numpy=1.26.4
  - cmake
  - gcc_linux-64=12.3.0
  - gxx_linux-64=12.3.0
  - ninja
  - packaging
  - pybind11
  - setuptools
  - wheel
  - git
  - git-lfs
  - ffmpeg
  - libgl
  - libstdcxx-ng
  - pip:
      - hatchling
      - hatch-vcs
